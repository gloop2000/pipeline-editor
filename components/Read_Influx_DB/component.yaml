name: InfluxDB read data
description: Reads data from an InfluxDB bucket using a query and saves it as CSV.
metadata:
  annotations:
    author: Sharath K R
    canonical_location: "https://github.com/example/components/InfluxDB/Read/component.yaml"

inputs:
  - {
      name: URL,
      type: String,
      description: "InfluxDB server URL, e.g. https://us-east-1-1.aws.cloud2.influxdata.com",
    }
  - { name: Token, type: String, description: "InfluxDB authentication token" }
  - { name: Database, type: String, description: "InfluxDB database name" }
  - {
      name: Query,
      type: String,
      default: "SELECT * FROM measurement WHERE time >= now() - 1h",
      description: "SQL or InfluxQL query to select data",
    }

outputs:
  - {
      name: Data,
      type: CSV,
      description: "Output CSV file containing the queried data",
    }

implementation:
  container:
    image: python:3.10
    command:
      - sh
      - -c
      - >
        (PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location
        'influxdb3-python==0.8.0' 'pandas==2.2.2' || PIP_DISABLE_PIP_VERSION_CHECK=1 python3
        -m pip install --quiet --no-warn-script-location 'influxdb3-python==0.8.0' 'pandas==2.2.2'
        --user) && "$0" "$@"
      - sh
      - -ec
      - |
        program_path=$(mktemp)
        printf "%s" "$0" > "$program_path"
        python3 -u "$program_path" "$@"
      - |
        def _make_parent_dirs_and_return_path(file_path: str):
            import os
            os.makedirs(os.path.dirname(file_path), exist_ok=True)
            return file_path

        def influxdb_read_to_csv(
            url: str,
            token: str,
            database: str,
            query: str,
            output_path: str
        ):
            """Reads data from InfluxDB using a query and saves it as CSV."""
            import pandas as pd
            from influxdb_client_3 import InfluxDBClient3

            client = InfluxDBClient3(host=url, token=token, database=database)
            try:
                result = client.query(query=query)
                # Convert PyArrow Table to pandas DataFrame
                if result is not None:
                    df = result.to_pandas()
                else:
                    df = pd.DataFrame()
                if df is None or df.empty:
                    print("No data returned for the query.")
                    df = pd.DataFrame()
                df.to_csv(output_path, index=False)
                print(f"Exported {len(df)} rows to {output_path}")
            except Exception as e:
                print("Error querying InfluxDB:", e)
                pd.DataFrame().to_csv(output_path, index=False)
            finally:
                client.close()

        import argparse
        _parser = argparse.ArgumentParser(prog='InfluxDB read data', description='Reads data from InfluxDB using a query and saves it as CSV.')
        _parser.add_argument("--URL", dest="url", type=str, required=True, default=argparse.SUPPRESS)
        _parser.add_argument("--Token", dest="token", type=str, required=True, default=argparse.SUPPRESS)
        _parser.add_argument("--Database", dest="database", type=str, required=True, default=argparse.SUPPRESS)
        _parser.add_argument("--Query", dest="query", type=str, required=False, default='SELECT * FROM measurement WHERE time >= now() - 1h')
        _parser.add_argument("--Data", dest="output_path", type=_make_parent_dirs_and_return_path, required=True, default=argparse.SUPPRESS)
        _parsed_args = vars(_parser.parse_args())

        _outputs = influxdb_read_to_csv(**_parsed_args)
    args:
      - --URL
      - { inputValue: URL }
      - --Token
      - { inputValue: Token }
      - --Database
      - { inputValue: Database }
      - --Query
      - { inputValue: Query }
      - --Data
      - { outputPath: Data }
